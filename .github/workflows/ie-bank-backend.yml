name: 'Backend CI/CD'

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ie-bank-backend.yml'

env:
  BACKEND_WEBAPP_DEV: mridella-asc-backend #Exercise IV: set the name of your web app
  IMAGE_NAME: mridella-asc-backend #Exercise IV: set the name of container image
  

jobs:
  build:
    
    runs-on: ubuntu-latest
    env:
      ENV: ghci
      ACR_NAME_DEV: mridellaacr

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
        working-directory: ./backend

      - name: Lint with flake8
        run: |
          pip install flake8 pytest
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          working-directory: ./backend

      - name: Test with pytest
        run: |
            python -m pytest --cov=iebank_api -v
        working-directory: ./backend
        
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
            name: python-app
            path: |
              .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Get ACR credentials from Dev Key Vault'
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: "mridella-kv"
          secrets: 'registry-username, registry-password'
        id: devKeyvaultSecrets

      - name: 'Login to ACR'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME_DEV }}.azurecr.io
          username: ${{ steps.devKeyvaultSecrets.outputs.registry-username }}
          password: ${{ steps.devKeyvaultSecrets.outputs.registry-password }}

      - name: 'Build and push image for Dev'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME_DEV }}.azurecr.io
          username: ${{ steps.devKeyvaultSecrets.outputs.registry-username }}
          password: ${{ steps.devKeyvaultSecrets.outputs.registry-password }}
      
      - name: 'Build and push container image for Dev'
        run: |
              docker build . -t ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev
              docker tag ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev:${{ github.sha }}
              docker push ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev:${{ github.sha }}
              docker push ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev
    
      - name: 'Deploy to Azure Web App Development'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ env.BACKEND_WEBAPP_DEV }}
          images: ${{ env.ACR_NAME_DEV }}.azurecr.io/${{ env.IMAGE_NAME }}-dev:latest
          package: .